name: Test and deploy replay lab

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Build replay fixtures
        run: npm run build

      - name: Upload replay lab
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/replay

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy replay lab
        id: deployment
        uses: actions/deploy-pages@v4